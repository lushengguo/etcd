[package]
name = "etcd"
version = "1.0.0"
edition = "2021"

[dependencies]
lazy_static = "1.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
log = "0.4"
env_logger = "0.9"
chrono = "0.4"
once_cell = "1.8"
tonic = "0.10"
prost = "0.12"
futures = "0.3"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "raft_test"
path = "src/bin/raft_test.rs"